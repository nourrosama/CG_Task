<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ clinic }} - WhatsApp Demo</title>
  <style>
    body {
      margin: 0; font-family: Arial, Helvetica, sans-serif;
      background: #d1d7db; display: flex; justify-content: center;
      align-items: center; min-height: 100vh;
    }
    .phone {
      width: 380px; height: 680px; background: #e5ddd5; border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    header {
      background: #075e54; color: #fff; padding: 14px 16px;
      font-weight: bold; font-size: 16px;
    }
    header small { display: block; font-weight: normal; opacity: 0.8; font-size: 12px; }
    #chat { flex: 1; overflow-y: auto; padding: 12px; }
    .bubble {
      max-width: 75%; padding: 8px 10px; margin: 6px 0; border-radius: 8px;
      font-size: 14px; line-height: 1.4; white-space: pre-wrap;
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    }
    .bubble.user { background: #dcf8c6; margin-left: auto; border-top-right-radius: 0; }
    .bubble.bot  { background: #fff; margin-right: auto; border-top-left-radius: 0; }
    .bubble.typing { color: #888; font-style: italic; }
    .quick { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px; }
    .quick button {
      background: #fff; border: 1px solid #075e54; color: #075e54;
      border-radius: 14px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    form { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
    #input {
      flex: 1; border: none; border-radius: 20px; padding: 10px 14px;
      font-size: 14px; outline: none;
    }
    #send {
      background: #075e54; color: #fff; border: none; border-radius: 50%;
      width: 42px; height: 42px; cursor: pointer; font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      {{ clinic }}
      <small>online</small>
    </header>

    <div id="chat">
      <div class="bubble bot">Hi! 👋 Welcome to {{ clinic }}. How can I help you today?</div>
    </div>

    <div class="quick">
      <button data-q="What are your opening hours?">Opening hours</button>
      <button data-q="How do I book an appointment?">Book</button>
      <button data-q="What are your prices?">Prices</button>
      <button data-q="Where are you located?">Location</button>
    </div>

    <form id="form">
      <input id="input" placeholder="Type a message" autocomplete="off">
      <button id="send" type="submit">➤</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const history = [];   // sent to the server with each message

    function addBubble(text, role) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;

      addBubble(text, "user");
      history.push({ role: "user", text: text });
      input.value = "";

      const typing = addBubble("typing...", "bot typing");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: history })
        });
        const data = await res.json();
        typing.remove();
        const reply = data.reply || data.error || "Something went wrong.";
        history.push({ role: "bot", text: reply });
        addBubble(reply, "bot");
      } catch (err) {
        typing.remove();
        addBubble("Network error. Is the server running?", "bot");
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      send(input.value);
    });

    document.querySelectorAll(".quick button").forEach((btn) => {
      btn.addEventListener("click", () => send(btn.dataset.q));
    });
  </script>
</body>
</html>
